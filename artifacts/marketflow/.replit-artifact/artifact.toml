kind = "web"
  previewPath = "/"
  title = "MarketFlow ERP"
  version = "1.0.0"
  id = "artifacts/marketflow"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 20659

  [services.development]
  run = "pnpm --filter @workspace/marketflow run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/marketflow", "run", "build" ]
  publicDir = "artifacts/marketflow/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "20659"
  BASE_PATH = "/"
  